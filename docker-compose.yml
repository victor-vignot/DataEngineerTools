services:
  jupyter:
    build: .
    ports:
      - "8888:8888"
    volumes:
      - .:/app
    depends_on:
      - selenium

  # Navigateur Chrome piloté par Selenium (Part5).
  # Le notebook s'y connecte sur http://selenium:4444
  # et on regarde le navigateur en direct sur http://localhost:7900
  selenium:
    image: selenium/standalone-chromium:latest
    shm_size: 2gb
    ports:
      - "4444:4444"
      - "7900:7900"
    environment:
      - SE_VNC_NO_PASSWORD=1
      - SE_NODE_MAX_SESSIONS=2
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
